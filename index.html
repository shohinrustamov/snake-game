<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iloncha O'yini</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1a0d;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  h1 {
    font-size: 28px; font-weight: 500;
    color: #4eff8a; letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  #header {
    display: flex; justify-content: space-between;
    align-items: center; width: 400px; margin-bottom: 12px;
  }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 11px; color: #8a9e8a; letter-spacing: 0.08em; text-transform: uppercase; }
  .stat-value { font-size: 22px; font-weight: 500; color: #fff; }
  #level-badge {
    font-size: 13px; color: #3dba6e;
    background: rgba(61,186,110,0.1); padding: 2px 10px;
    border-radius: 20px; border: 1px solid rgba(61,186,110,0.3);
  }
  #canvas-wrap {
    position: relative;
    border: 2px solid #2a4a2a;
    border-radius: 4px; overflow: hidden;
  }
  canvas { display: block; background: #0a0f0a; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.8);
  }
  #overlay h2 { font-size: 24px; font-weight: 500; margin-bottom: 8px; letter-spacing: 0.04em; }
  #overlay p { font-size: 13px; color: #8a9e8a; margin-bottom: 20px; text-align: center; line-height: 1.6; }
  #startBtn {
    padding: 10px 32px;
    border: 1.5px solid #3dba6e;
    background: transparent;
    color: #3dba6e; font-family: 'Courier New', monospace;
    font-size: 15px; border-radius: 4px;
    cursor: pointer; letter-spacing: 0.08em;
    transition: background 0.15s;
  }
  #startBtn:hover { background: rgba(61,186,110,0.15); }
  #footer {
    width: 400px; margin-top: 14px;
    display: flex; justify-content: center; gap: 24px;
    font-size: 12px; color: #6a7e6a;
  }
  .key {
    display: inline-block; padding: 2px 7px;
    border: 1px solid #2a4a2a;
    border-radius: 3px; font-family: 'Courier New', monospace;
    font-size: 11px; color: #8a9e8a; margin: 0 2px;
  }
  #credit {
    margin-top: 20px; font-size: 11px; color: #3a5a3a;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<h1>🐍 ILONCHA</h1>

<div id="header">
  <div class="stat">
    <span class="stat-label">Ball</span>
    <span class="stat-value" id="scoreEl">0</span>
  </div>
  <span id="level-badge">DARAJA 1</span>
  <div class="stat">
    <span class="stat-label">Rekord</span>
    <span class="stat-value" id="hiEl">0</span>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>🐍 ILONCHA</h2>
    <p>Klaviatura strelkalari bilan boshqaring<br><span style="color:#4eff8a">↑ ↓ ← →</span> &nbsp;|&nbsp; <span style="color:#4eff8a">P</span> — pauza</p>
    <button id="startBtn">BOSHLASH</button>
  </div>
</div>

<div id="footer">
  <span><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> Harakat</span>
  <span><span class="key">P</span> To'xtatish</span>
</div>

<div id="credit">Created by Shohin</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreEl');
const hiEl = document.getElementById('hiEl');
const levelBadge = document.getElementById('level-badge');

const COLS = 20, ROWS = 20, CELL = 20;

let snake, dir, nextDir, food, score, hiScore = 0;
let gameRunning = false, paused = false;
let interval, level, speed;

function initGame() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0; level = 1; speed = 150;
  scoreEl.textContent = 0;
  levelBadge.textContent = 'DARAJA 1';
  spawnFood();
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food = pos;
}

function draw() {
  ctx.fillStyle = '#0a0f0a';
  ctx.fillRect(0,0,400,400);

  ctx.strokeStyle = '#111811';
  ctx.lineWidth = 0.5;
  for(let i=0;i<=COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,400); ctx.stroke();
  }
  for(let j=0;j<=ROWS;j++){
    ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(400,j*CELL); ctx.stroke();
  }

  // Food glow
  ctx.fillStyle = 'rgba(255,82,82,0.25)';
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.75, 0, Math.PI*2);
  ctx.fill();

  // Food
  ctx.fillStyle = '#ff5252';
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.35, 0, Math.PI*2);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    if (i === 0) {
      ctx.fillStyle = '#4eff8a';
    } else {
      const r1=[0x3d,0xba,0x6e], r2=[0x1e,0x5c,0x38];
      const mix = r => Math.round(r1[r] + (r2[r]-r1[r])*t);
      ctx.fillStyle = `rgb(${mix(0)},${mix(1)},${mix(2)})`;
    }
    const pad = i===0?1:2;
    ctx.beginPath();
    ctx.roundRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2, i===0?4:3);
    ctx.fill();

    // Eyes on head
    if(i===0){
      ctx.fillStyle = '#0a1a0f';
      const bx = CELL/2 + dir.x*4;
      const by = CELL/2 + dir.y*4;
      [-1,1].forEach(s=>{
        ctx.beginPath();
        ctx.arc(seg.x*CELL + bx + (-dir.y)*s*4, seg.y*CELL + by + (dir.x)*s*4, 2.5, 0, Math.PI*2);
        ctx.fill();
      });
    }
  });

  if(paused){
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle = '#fff';
    ctx.font = '500 18px "Courier New"';
    ctx.textAlign='center';
    ctx.fillText('PAUZA — davom etish uchun P bosing', 200, 200);
    ctx.textAlign='left';
  }
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};

  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    endGame(); return;
  }

  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score += level * 10;
    scoreEl.textContent = score;
    if(score > hiScore){ hiScore = score; hiEl.textContent = hiScore; }
    const newLevel = Math.floor(score/100)+1;
    if(newLevel !== level){
      level = newLevel;
      levelBadge.textContent = 'DARAJA '+level;
      clearInterval(interval);
      speed = Math.max(60, 150 - (level-1)*15);
      interval = setInterval(step, speed);
    }
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function endGame(){
  clearInterval(interval);
  gameRunning = false;
  overlay.innerHTML = `
    <h2 style="color:#ff5252">O'YIN TUGADI!</h2>
    <p>Ball: <strong style="color:#fff">${score}</strong> &nbsp;|&nbsp; Rekord: <strong style="color:#4eff8a">${hiScore}</strong></p>
    <button id="startBtn" style="border-color:#3dba6e;color:#3dba6e;padding:10px 32px;border-width:1.5px;border-style:solid;background:transparent;font-family:'Courier New',monospace;font-size:15px;border-radius:4px;cursor:pointer;letter-spacing:0.08em;">QAYTA O'YNASH</button>
  `;
  overlay.style.display='flex';
  document.getElementById('startBtn').onclick = startGame;
}

function startGame(){
  overlay.style.display='none';
  initGame();
  gameRunning=true; paused=false;
  draw();
  interval = setInterval(step, speed);
}

document.getElementById('startBtn').onclick = startGame;

document.addEventListener('keydown', e=>{
  if(!gameRunning) return;
  if(e.key==='p'||e.key==='P'){
    paused=!paused;
    if(!paused) draw();
    return;
  }
  if(paused) return;
  const map = {
    'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},
    'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0}
  };
  const d = map[e.key];
  if(!d) return;
  e.preventDefault();
  if(d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});

draw();
</script>
</body>
</html>
