<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Iloncha O'yini</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0d1a0d;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: clamp(16px, 5vw, 24px);
    font-weight: 500; color: #4eff8a;
    letter-spacing: 0.1em; margin-bottom: 8px;
  }
  #header {
    display: flex; justify-content: space-between;
    align-items: center; width: var(--board); margin-bottom: 6px;
  }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 10px; color: #8a9e8a; letter-spacing: 0.08em; text-transform: uppercase; }
  .stat-value { font-size: clamp(16px, 4vw, 22px); font-weight: 500; }
  #level-badge {
    font-size: 11px; color: #3dba6e;
    background: rgba(61,186,110,0.1); padding: 2px 10px;
    border-radius: 20px; border: 1px solid rgba(61,186,110,0.3);
  }
  #canvas-wrap {
    position: relative;
    border: 2px solid #2a4a2a;
    border-radius: 4px; overflow: hidden;
    width: var(--board); height: var(--board);
    flex-shrink: 0;
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82);
  }
  #overlay h2 { font-size: clamp(16px,5vw,22px); font-weight: 500; margin-bottom: 8px; }
  #overlay p { font-size: 12px; color: #8a9e8a; margin-bottom: 18px; text-align: center; line-height: 1.7; padding: 0 20px; }
  .obtn {
    padding: 10px 28px;
    border: 1.5px solid #3dba6e; background: transparent;
    color: #3dba6e; font-family: 'Courier New', monospace;
    font-size: 14px; border-radius: 4px;
    cursor: pointer; letter-spacing: 0.08em;
  }
  .obtn:active { background: rgba(61,186,110,0.18); }

  /* D-PAD */
  #dpad {
    display: grid;
    grid-template-areas: ". up ." "left . right" ". down .";
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    width: var(--board);
    margin-top: 10px;
  }
  .dkey {
    display: flex; align-items: center; justify-content: center;
    background: rgba(61,186,110,0.07);
    border: 1.5px solid rgba(61,186,110,0.22);
    border-radius: 10px;
    height: clamp(42px, 13vw, 60px);
    font-size: clamp(18px, 6vw, 28px);
    cursor: pointer; color: #3dba6e;
    transition: background 0.08s, transform 0.07s;
    touch-action: manipulation;
  }
  .dkey:active, .dkey.pressed {
    background: rgba(61,186,110,0.22);
    transform: scale(0.91);
  }
  #btn-up    { grid-area: up; }
  #btn-left  { grid-area: left; }
  #btn-right { grid-area: right; }
  #btn-down  { grid-area: down; }

  #kbhint {
    margin-top: 10px; font-size: 11px; color: #3a5a3a;
    display: flex; gap: 16px;
  }
  .key {
    display: inline-block; padding: 1px 6px;
    border: 1px solid #2a4a2a; border-radius: 3px;
    font-size: 10px; color: #5a7a5a; margin: 0 1px;
  }
  #credit { margin-top: 8px; font-size: 10px; color: #2a4a2a; letter-spacing: 0.04em; }
</style>
</head>
<body>

<script>
  const vw = Math.min(window.innerWidth, window.innerHeight, 480);
  const board = Math.floor((vw - 28) / 20) * 20;
  document.documentElement.style.setProperty('--board', board + 'px');
</script>

<h1>🐍 ILONCHA</h1>

<div id="header">
  <div class="stat">
    <span class="stat-label">Ball</span>
    <span class="stat-value" id="scoreEl">0</span>
  </div>
  <span id="level-badge">DARAJA 1</span>
  <div class="stat">
    <span class="stat-label">Rekord</span>
    <span class="stat-value" id="hiEl">0</span>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>🐍 ILONCHA</h2>
    <p>Klaviatura strelkalari yoki<br>quyidagi tugmalar bilan boshqaring<br><span style="color:#4eff8a">P</span> — pauza</p>
    <button class="obtn" id="startBtn">BOSHLASH</button>
  </div>
</div>

<div id="dpad">
  <button class="dkey" id="btn-up"    aria-label="Yuqori">▲</button>
  <button class="dkey" id="btn-left"  aria-label="Chap">◀</button>
  <button class="dkey" id="btn-right" aria-label="O'ng">▶</button>
  <button class="dkey" id="btn-down"  aria-label="Pastga">▼</button>
</div>

<div id="kbhint">
  <span><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> Harakat</span>
  <span><span class="key">P</span> Pauza</span>
</div>

<div id="credit">Created by @shohinrustamov</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreEl');
const hiEl = document.getElementById('hiEl');
const levelBadge = document.getElementById('level-badge');
const COLS = 20, ROWS = 20, C = 20;

let snake, dir, nextDir, food, score, hiScore = 0;
let gameRunning = false, paused = false;
let interval, level, speed;

function initGame() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; level = 1; speed = 150;
  scoreEl.textContent = 0;
  levelBadge.textContent = 'DARAJA 1';
  spawnFood();
}

function spawnFood() {
  let pos;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food = pos;
}

function draw() {
  ctx.fillStyle = '#0a0f0a';
  ctx.fillRect(0,0,400,400);
  ctx.strokeStyle = '#111811'; ctx.lineWidth = 0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,400);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*C);ctx.lineTo(400,j*C);ctx.stroke();}

  ctx.fillStyle='rgba(255,82,82,0.22)';
  ctx.beginPath();ctx.arc(food.x*C+C/2,food.y*C+C/2,C*0.75,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff5252';
  ctx.beginPath();ctx.arc(food.x*C+C/2,food.y*C+C/2,C*0.35,0,Math.PI*2);ctx.fill();

  snake.forEach((seg,i)=>{
    const t=i/snake.length;
    if(i===0){ctx.fillStyle='#4eff8a';}
    else{
      const r1=[0x3d,0xba,0x6e],r2=[0x1e,0x5c,0x38];
      const mx=r=>Math.round(r1[r]+(r2[r]-r1[r])*t);
      ctx.fillStyle=`rgb(${mx(0)},${mx(1)},${mx(2)})`;
    }
    const pad=i===0?1:2;
    ctx.beginPath();ctx.roundRect(seg.x*C+pad,seg.y*C+pad,C-pad*2,C-pad*2,i===0?4:3);ctx.fill();
    if(i===0){
      ctx.fillStyle='#0a1a0f';
      const bx=C/2+dir.x*4,by=C/2+dir.y*4;
      [-1,1].forEach(s=>{
        ctx.beginPath();ctx.arc(seg.x*C+bx+(-dir.y)*s*4,seg.y*C+by+(dir.x)*s*4,2.5,0,Math.PI*2);ctx.fill();
      });
    }
  });

  if(paused){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#fff';ctx.font='500 16px "Courier New"';ctx.textAlign='center';
    ctx.fillText('PAUZA',200,200);ctx.textAlign='left';
  }
}

function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){endGame();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=level*10; scoreEl.textContent=score;
    if(score>hiScore){hiScore=score;hiEl.textContent=hiScore;}
    const nl=Math.floor(score/100)+1;
    if(nl!==level){level=nl;levelBadge.textContent='DARAJA '+level;clearInterval(interval);speed=Math.max(60,150-(level-1)*15);interval=setInterval(step,speed);}
    spawnFood();
  } else {snake.pop();}
  draw();
}

function endGame(){
  clearInterval(interval); gameRunning=false;
  overlay.innerHTML=`
    <h2 style="color:#ff5252">O'YIN TUGADI!</h2>
    <p>Ball: <strong style="color:#fff">${score}</strong><br>Rekord: <strong style="color:#4eff8a">${hiScore}</strong></p>
    <button class="obtn" id="startBtn">QAYTA O'YNASH</button>
  `;
  overlay.style.display='flex';
  document.getElementById('startBtn').onclick=startGame;
}

function startGame(){
  overlay.style.display='none';
  initGame(); gameRunning=true; paused=false;
  draw(); interval=setInterval(step,speed);
}

document.getElementById('startBtn').onclick=startGame;

// Keyboard
document.addEventListener('keydown',e=>{
  if(!gameRunning) return;
  if(e.key==='p'||e.key==='P'){paused=!paused;if(!paused)draw();return;}
  if(paused) return;
  const map={'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0}};
  const d=map[e.key]; if(!d) return; e.preventDefault();
  if(d.x!==-dir.x||d.y!==-dir.y) nextDir=d;
});

// D-pad
function move(dx,dy){
  if(!gameRunning){startGame();return;}
  if(paused){paused=false;draw();return;}
  const d={x:dx,y:dy};
  if(d.x!==-dir.x||d.y!==-dir.y) nextDir=d;
}

function bindBtn(id,dx,dy){
  const btn=document.getElementById(id);
  btn.addEventListener('touchstart',e=>{e.preventDefault();btn.classList.add('pressed');move(dx,dy);},{passive:false});
  btn.addEventListener('touchend',()=>btn.classList.remove('pressed'));
  btn.addEventListener('mousedown',e=>{e.preventDefault();btn.classList.add('pressed');move(dx,dy);});
  btn.addEventListener('mouseup',()=>btn.classList.remove('pressed'));
  btn.addEventListener('mouseleave',()=>btn.classList.remove('pressed'));
}

bindBtn('btn-up',0,-1);
bindBtn('btn-down',0,1);
bindBtn('btn-left',-1,0);
bindBtn('btn-right',1,0);

// Swipe on canvas
let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!gameRunning) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<12&&Math.abs(dy)<12) return;
  let d=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(d.x!==-dir.x||d.y!==-dir.y) nextDir=d;
},{passive:true});

draw();
</script>
</body>
</html>
